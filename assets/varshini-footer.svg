<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80" role="img" aria-label="Varshini footer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="vf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sweep{animation:sweep 6s ease-in-out infinite}
    @keyframes sweep{0%,100%{opacity:.5}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.sweep{animation:none}}
  </style>
  <rect width="1000" height="80" fill="#10070C" rx="12"/>
  <rect class="sweep" x="100" y="38" width="800" height="2" fill="url(#vf-line)"/>
  <text x="500" y="64" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#C77B9B">Varshini</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
