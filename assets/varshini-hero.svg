<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Varshini</title>
  <desc id="d">Varshini, student at Dayananda Sagar University, Bangalore</desc>
  <defs>
    <linearGradient id="vh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="vh-glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vh-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
    <pattern id="vh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="vh-blur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="vh-clip"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 3.2s ease-out 0.3s backwards}
    .orbit{transform-origin:820px 160px;animation:spin 48s linear infinite}
    .orbit2{transform-origin:820px 160px;animation:spin 80s linear infinite reverse}
    .glow{animation:pulse 5s ease-in-out infinite}
    .rise{animation:rise 1.1s ease-out 0.2s backwards}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.draw,.orbit,.orbit2,.glow,.rise{animation:none}}
  </style>
  <g clip-path="url(#vh-clip)">
    <rect width="1000" height="320" fill="url(#vh-bg)"/>
    <rect width="1000" height="320" fill="url(#vh-grid)"/>
    <rect width="1000" height="320" fill="url(#vh-glow)"/>

    <!-- orbital geometry -->
    <g fill="none" stroke="#C77B9B">
      <circle class="orbit" cx="820" cy="160" r="110" stroke-opacity="0.35" stroke-dasharray="3 9"/>
      <circle class="orbit2" cx="820" cy="160" r="70" stroke-opacity="0.5" stroke-dasharray="1 7"/>
      <circle cx="820" cy="160" r="150" stroke-opacity="0.12"/>
    </g>
    <g class="orbit"><circle cx="930" cy="160" r="5" fill="#E5B5C7"/></g>
    <g class="orbit2"><circle cx="750" cy="160" r="3.5" fill="#C77B9B"/></g>

    <!-- drawn path -->
    <path class="draw" pathLength="1" d="M40 270 C 200 220, 300 290, 460 240 S 700 190, 960 250"
          fill="none" stroke="url(#vh-line)" stroke-width="2" stroke-linecap="round"/>

    <!-- name -->
    <g class="rise">
      <text class="serif" x="60" y="150" font-size="84" font-weight="700" fill="#F8F0F3" letter-spacing="1">Varshini</text>
      <text class="sans" x="62" y="196" font-size="22" fill="#E5B5C7">Dayananda Sagar University, Bangalore</text>
    </g>

    <!-- glowing underline -->
    <rect class="glow" x="62" y="214" width="260" height="6" rx="3" fill="#C77B9B" filter="url(#vh-blur)"/>
    <rect x="62" y="215" width="260" height="3" rx="1.5" fill="url(#vh-line)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
